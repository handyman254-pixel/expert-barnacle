<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Random Fun Facts</title>\n    <style>\n        body {\n            font-family: Arial, sans-serif;\n            text-align: center;\n            margin-top: 50px;\n        }\n        #fact {\n            font-size: 24px;\n            margin-bottom: 20px;\n        }\n        button {\n            padding: 10px 20px;\n            font-size: 16px;\n            cursor: pointer;\n        }\n    </style>\n</head>\n<body>\n    <div id="fact">Click the button to generate a fun fact!</div>\n    <button onclick="generateFact()">Generate Fun Fact</button>\n    <script>\n        const facts = [\n            'Honey never spoils.',\n            'Bananas are berries, but strawberries are not.',\n            'A group of flamingos is called a "flamboyance."',\n            'There are more stars in the universe than grains of sand on all the world’s beaches.',\n            'Octopuses have three hearts.',\n            'Frogs can freeze without dying.',\n            'Wombat poop is cube-shaped.'\n        ];\n        function generateFact() {\n            const randomIndex = Math.floor(Math.random() * facts.length);\n            document.getElementById('fact').innerText = facts[randomIndex];\n        }\n    <\/script>\n</body>\n</html>
